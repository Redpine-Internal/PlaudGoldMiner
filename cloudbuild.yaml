# Build da imagem Next.js standalone, push no Artifact Registry e deploy no Cloud Run.
# Uso: gcloud builds submit --project=plaudgoldminersistema --config=cloudbuild.yaml
substitutions:
  _REGION: us-central1
  _SERVICE: plaudgoldminer
  _IMAGE: us-central1-docker.pkg.dev/plaudgoldminersistema/plaudgoldminer/plaudgoldminer
  # anon key do Supabase é pública por design; embutida no bundle no build.
  _NEXT_PUBLIC_SUPABASE_URL: ""
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ""

steps:
  # 1) Build
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - -t
      - ${_IMAGE}:$BUILD_ID
      - -t
      - ${_IMAGE}:latest
      - .

  # 2) Push (ambas as tags)
  - name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]

  # 3) Deploy no Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=4
      - --set-env-vars=NODE_ENV=production,NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL},NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - --set-secrets=MEETINGS_DATABASE_URL=meetings-database-url:latest,SUPABASE_URL_SISTEMA=supabase-url-sistema:latest,SUPABASE_SERVICE_ROLE_KEY_SISTEMA=supabase-service-role-key-sistema:latest,AUTH_SECRET=auth-secret:latest,AZURE_OPENAI_API_KEY=azure-openai-api-key:latest,AZURE_OPENAI_RESOURCE_NAME=azure-openai-resource-name:latest,AZURE_OPENAI_DEPLOYMENT=azure-openai-deployment:latest,N8N_WEBHOOK_SECRET=n8n-webhook-secret:latest,N8N_WEBHOOK_URL=n8n-webhook-url:latest

images:
  - "${_IMAGE}:$BUILD_ID"
  - "${_IMAGE}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  substitution_option: ALLOW_LOOSE

timeout: 1200s
