      summary: "14 decisões arquiteturais, Drizzle+Turso, Vercel AI SDK+Claude, TanStack Query"

    - id: "create-epics-and-stories"
      status: "docs/epics.md"
      agent: "pm"
      command: "create-epics-and-stories"
      completed: "2025-12-01"
      outputs:
        - "docs/epics.md"
      summary: "6 épicos, 23 stories, 35 FRs cobertos (100%)"

    - id: "test-design"
      status: "recommended"
      agent: "tea"
      command: "test-design"

    - id: "validate-architecture"
      status: "optional"
      agent: "architect"
      command: "validate-architecture"

    - id: "implementation-readiness"
      status: "docs/implementation-readiness-report-2025-12-01.md"
      agent: "architect"
      command: "implementation-readiness"
      completed: "2025-12-01"
      outputs:
        - "docs/implementation-readiness-report-2025-12-01.md"
      summary: "READY - 35/35 FRs cobertos, gaps corrigidos, pronto para sprint-planning"

  # Fase 3 - Implementation
  phase_3_implementation:
    - id: "sprint-planning"
      status: "docs/sprint-artifacts/sprint-status.yaml"
      agent: "sm"
