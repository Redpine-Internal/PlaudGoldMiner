# Workflow Status - BMad Method
# Este arquivo rastreia o progresso através das fases de Análise, Planejamento e Solutioning do BMM.
# A fase de Implementação é rastreada separadamente em sprint-status.yaml

# DEFINIÇÕES DE STATUS:
# ====================
# Status Inicial (antes da conclusão):
#   - required: Deve ser completado para progredir
#   - optional: Pode ser completado mas não é obrigatório
#   - recommended: Fortemente sugerido mas não obrigatório
#   - conditional: Obrigatório apenas se certas condições forem atendidas (ex: if_has_ui)
#   - selected: Selecionado pelo usuário durante workflow-init
#
# Status de Conclusão:
#   - {file-path}: Arquivo criado/encontrado (ex: "docs/product-brief.md")
#   - skipped: Workflow opcional/condicional que foi pulado

generated: "2025-11-28"
project: "ehs-insights"
project_type: "Andresa AI - Plataforma de gestão de conversas, oportunidades e conteúdos"
selected_track: "bmad-method"
field_type: "brownfield"
workflow_path: "method-brownfield.yaml"

workflow_status:
  # Pré-requisito - Documentação do Projeto Existente
  prerequisite:
    - id: "document-project"
      status: "docs/index.md"
      agent: "analyst"
      command: "document-project"
      purpose: "Entender codebase existente antes do planejamento"
      completed: "2025-11-28"
      outputs:
        - "docs/index.md"
        - "docs/project-overview.md"
        - "docs/architecture.md"
        - "docs/source-tree-analysis.md"
        - "docs/component-inventory.md"
        - "docs/data-models.md"
